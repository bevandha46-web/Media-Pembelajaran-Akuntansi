<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>LabaLab - Media Pembelajaran Akuntansi Dasar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;
      --accent: #d97706;
      --sidebar-bg: #0f2926;
      --sidebar-hover: #173d38;
      --bg: #f2f6f5;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #dce5e3;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 4px 18px rgba(15, 41, 38, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 66px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      z-index: 100;
      gap: 14px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 210px;
    }

    .menu-toggle {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      width: 38px; height: 38px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      color: var(--text);
      align-items: center;
      justify-content: center;
    }

    .brand-logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
      flex-shrink: 0;
    }

    .brand-text h1 { font-size: 18px; font-weight: 800; color: var(--primary); line-height: 1.1; }
    .brand-text span { font-size: 11px; color: var(--text-muted); display: block; }

    .topnav {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
    }

    .topnav button {
      background: transparent;
      border: none;
      padding: 7px 14px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .topnav button:hover { color: var(--primary); }
    .topnav button.active { background: #fff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .search-box { position: relative; width: 210px; }
    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--primary); background: #fff; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--text-muted); }

    .search-results {
      position: absolute;
      top: 42px; left: 0; right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
      max-height: 290px;
      overflow-y: auto;
      display: none;
      z-index: 200;
    }
    .search-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
    .search-item:hover { background: #f0fdfa; }
    .search-item small { display: block; color: var(--text-muted); font-size: 11px; }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .avatar-circle {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
    }
    .avatar-circle.admin-mode { background: var(--primary); }

    .app-container { display: flex; padding-top: 66px; min-height: 100vh; }

    .sidebar {
      width: 266px;
      background: var(--sidebar-bg);
      color: #cbd5e1;
      padding: 18px 14px;
      position: fixed;
      top: 66px; bottom: 0; left: 0;
      overflow-y: auto;
      z-index: 90;
      transition: transform 0.3s ease;
    }

    .sidebar-label {
      font-size: 10.5px;
      font-weight: 700;
      color: #5eead4;
      letter-spacing: 0.08em;
      padding: 10px 12px 6px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: #e2e8f0;
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
      margin-bottom: 2px;
    }
    .nav-btn:hover { background: var(--sidebar-hover); color: #fff; }
    .nav-btn.active { background: var(--primary); color: #fff; }
    .nav-left { display: flex; align-items: center; gap: 10px; }
    .nav-badge {
      background: rgba(255,255,255,0.14);
      color: #99f6e4;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .nav-sub {
      margin-left: 18px;
      padding-left: 10px;
      border-left: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 8px;
    }

    .nav-sub-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      color: #94a3b8;
      cursor: pointer;
      text-align: left;
    }
    .nav-sub-btn:hover, .nav-sub-btn.active { color: #fff; background: var(--sidebar-hover); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .main { flex: 1; margin-left: 266px; padding: 26px 30px 60px; max-width: 1260px; }

    .hero {
      background: linear-gradient(135deg, #0f766e 0%, #115e59 60%, #0f2926 100%);
      border-radius: 20px;
      padding: 32px 34px;
      color: white;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 24px;
      align-items: center;
      box-shadow: 0 12px 30px rgba(15, 118, 110, 0.22);
      margin-bottom: 22px;
    }
    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.14);
      color: #99f6e4;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .hero h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; line-height: 1.25; }
    .hero p { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .btn-amber {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 11px 20px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
    }
    .btn-amber:hover { background: #b45309; }

    .btn-glass {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 11px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }

    .cycle-widget {
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 18px;
    }
    .cycle-widget h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #99f6e4; margin-bottom: 10px; }
    .cycle-step {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 12.5px; font-weight: 600;
    }
    .cycle-num {
      width: 22px; height: 22px; border-radius: 6px;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0;
    }

    .top-strip { display: grid; grid-template-columns: 1.7fr 1fr; gap: 18px; margin-bottom: 24px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .tp-card { border-top: 4px solid var(--primary); }
    .tp-card h4 { font-size: 15.5px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
    .tp-list { padding-left: 18px; font-size: 13px; }
    .tp-list li { margin-bottom: 5px; }

    .progress-card { border-top: 4px solid var(--accent); display: flex; flex-direction: column; justify-content: space-between; }
    .progress-bar-bg { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin: 10px 0; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #14b8a6); border-radius: 999px; transition: width 0.3s; }

    .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .section-header h3 { font-size: 20px; font-weight: 800; }
    .section-header p { font-size: 13px; color: var(--text-muted); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    .bab-card { border-left: 5px solid var(--primary); display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .bab-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(15, 41, 38, 0.08); }
    .bab-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .step-tag { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px; color: #fff; }
    .status-pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #f1f5f9; color: var(--text-muted); }
    .status-pill.done { background: #d1fae5; color: #065f46; }
    .bab-card h4 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
    .bab-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .bab-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid #f1f5f9; }

    .formula-box { background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 10px; padding: 12px 16px; margin: 10px 0; font-weight: 700; color: var(--primary-dark); font-size: 14px; }
    .example-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 12px 16px; margin: 10px 0; font-size: 13.5px; }
    .sim-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 16px; margin-top: 14px; }
    .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 10px 0; }

    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 13.5px;
      background: #fff;
    }
    .input-group textarea { min-height: 90px; resize: vertical; }

    .sim-result { margin-top: 10px; padding: 10px 14px; background: #fff; border-radius: 8px; border-left: 4px solid var(--primary); font-size: 13.5px; display: none; }

    .btn-primary {
      background: var(--primary); color: #fff; border: none;
      padding: 9px 16px; border-radius: 9px; font-family: inherit;
      font-weight: 700; font-size: 13px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary:hover { background: var(--primary-dark); }

    .btn-outline {
      background: #fff; color: var(--text); border: 1px solid var(--border);
      padding: 9px 16px; border-radius: 9px; font-family: inherit;
      font-weight: 600; font-size: 13px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-outline:hover { background: var(--bg); }

    .btn-danger {
      background: #fee2e2; color: var(--danger); border: 1px solid #fecaca;
      padding: 7px 12px; border-radius: 8px; font-family: inherit;
      font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .admin-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .admin-tab-btn {
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .admin-tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #0f2926;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 999;
      display: none;
    }

    .table-wrap { overflow-x: auto; margin: 10px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 12px; border: 1px solid var(--border); text-align: left; }
    th { background: #f0fdfa; color: var(--primary-dark); font-weight: 700; }

    .quiz-option {
      display: block; width: 100%; text-align: left;
      padding: 11px 14px; margin-bottom: 8px;
      border: 1px solid var(--border); border-radius: 9px;
      background: #fff; font-family: inherit; font-size: 13.5px; cursor: pointer;
    }
    .quiz-option:hover { background: #f0fdfa; border-color: var(--primary); }
    .quiz-option.selected { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
    .quiz-option.correct { background: #d1fae5; color: #065f46; border-color: #10b981; font-weight: 700; }
    .quiz-option.wrong { background: #fee2e2; color: #991b1b; border-color: #ef4444; }

    .small-guide-note { font-size: 10.5px; color: #94a3b8; font-style: italic; line-height: 1.4; }
    .page-nav-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 85; }

    @media (max-width: 1040px) {
      .topnav { display: none; }
      .hero, .top-strip { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .menu-toggle { display: flex; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main { margin-left: 0; padding: 18px 14px 50px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .search-box { width: 140px; }
      .user-pill span.user-name { display: none; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand-wrap">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <div class="brand-logo">LL</div>

  <div class="app-container">

  <div class="toast" id="toastBox">Perubahan berhasil disimpan!</div>

      contentHtml: `<div class="card" style="margin-bottom:18px;">
        <h4 style="font-size:17px; font-weight:800; margin-bottom:8px;">1. Konsep Dasar Akuntansi</h4>
        <p style="font-size:14px;">Akuntansi adalah bahasa bisnis untuk mencatat transaksi keuangan secara rapi agar pemilik usaha tahu apakah bisnisnya untung atau rugi. Pondasi utamanya disebut <strong>Persamaan Dasar Akuntansi</strong>:</p>

function loadAppData() {
  const saved = localStorage.getItem("labalab_appdata_v1");
  if (!saved) return JSON.parse(JSON.stringify(DEFAULT_DATA));
  try { return JSON.parse(saved); } catch { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}

let appData = loadAppData();

function saveAppData(msg = "Perubahan berhasil disimpan!") {
  localStorage.setItem("labalab_appdata_v1", JSON.stringify(appData));
  renderSidebar();
  renderTopUser();
  showToast(msg);
}

function showToast(msg) {
  const t = document.getElementById("toastBox");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2600);
}

function esc(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function markDone(babId) {
  state.completed[babId] = true;
  localStorage.setItem("labalab_done", JSON.stringify(state.completed));
  render();
}

function toggleSidebar(forceClose = false) {
  const sb = document.getElementById("sidebar");
  const ov = document.getElementById("sidebarOverlay");
  if (forceClose) { sb.classList.remove("open"); ov.classList.remove("open"); }
  else { sb.classList.toggle("open"); ov.classList.toggle("open"); }
}

function navigate(view) {
  state.view = view;
  toggleSidebar(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
  renderSidebar();
  updateTopNav();
  render();
}

function updateTopNav() {
  document.querySelectorAll(".topnav button").forEach(el => {
    el.classList.toggle("active", el.dataset.view === state.view);
  });
}

function renderTopUser() {
  const pill = document.getElementById("topUserPill");
  if (state.isAdmin) {
    pill.innerHTML = `<div class="avatar-circle admin-mode">PN</div><span class="user-name">Mode Penyusun ✓</span>`;
  } else {
    pill.innerHTML = `<div class="avatar-circle">PL</div><span class="user-name">Pelajar</span>`;
  }
}

  const sb = document.getElementById("sidebar");

function handleSearch(query) {
  const box = document.getElementById("searchResults");
  const q = query.trim().toLowerCase();
  if (!q) { box.style.display = "none"; return; }

  let hits = [];
  appData.chapters.forEach(c => {
    if (c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.num.toLowerCase().includes(q)) {
      hits.push({ title: `${c.num}: ${c.title}`, sub: "Materi Akuntansi", fn: () => navigate(c.id) });
    }
  });
  appData.glossary.forEach(g => {
    if (g[0].toLowerCase().includes(q) || g[1].toLowerCase().includes(q)) {
      hits.push({ title: g[0], sub: "Glosarium", fn: () => navigate("glosarium") });
    }
  });

  if (!hits.length) {
    box.innerHTML = `<div class="search-item">Tidak ada hasil untuk "${esc(query)}"</div>`;
  } else {
    box.innerHTML = hits.slice(0, 7).map((h, i) => `
      <div class="search-item" id="hit-${i}"><strong>${esc(h.title)}</strong><small>${h.sub}</small></div>
    `).join("");
    hits.slice(0, 7).forEach((h, i) => {
      document.getElementById(`hit-${i}`).onclick = () => {
        box.style.display = "none";
        document.getElementById("globalSearch").value = "";
        h.fn();
      };
    });
  }
  box.style.display = "block";
}

document.addEventListener("click", (e) => {

});

function cekPersamaan() {
  const h = parseFloat(document.getElementById("eq-harta").value) || 0;
  const u = parseFloat(document.getElementById("eq-utang").value) || 0;
  const m = parseFloat(document.getElementById("eq-modal").value) || 0;
  const kanan = u + m;
  const el = document.getElementById("res-eq");
  el.style.display = "block";
  el.innerHTML = h === kanan
    ? `✅ <strong>SEIMBANG (BALANCE)!</strong> Total Harta (Rp ${h.toLocaleString('id-ID')}) = Utang + Modal (Rp ${kanan.toLocaleString('id-ID')}).`
    : `❌ <strong>BELUM SEIMBANG!</strong> Selisih Rp ${Math.abs(h - kanan).toLocaleString('id-ID')}.`;
}
function cekDebitKredit() {
  const akun = document.getElementById("dk-akun").value;
  const arah = document.getElementById("dk-arah").value;
  const isLeft = (akun === "harta" || akun === "beban");
  const pos = (isLeft && arah === "naik") || (!isLeft && arah === "turun") ? "DEBIT (Sebelah Kiri)" : "KREDIT (Sebelah Kanan)";
  const el = document.getElementById("res-dk");
  el.style.display = "block";
  el.innerHTML = `👉 Dicatat di posisi: <strong>${pos}</strong>`;
}
function cekNeracaSaldo() {
  const d = parseFloat(document.getElementById("ns-deb").value) || 0;
  const k = parseFloat(document.getElementById("ns-kre").value) || 0;
  const el = document.getElementById("res-ns");
  el.style.display = "block";
  el.innerHTML = d === k ? `✅ <strong>BALANCE!</strong> Debit dan Kredit sama-sama Rp ${d.toLocaleString('id-ID')}.` : `⚠️ <strong>TIDAK BALANCE!</strong> Selisih Rp ${Math.abs(d - k).toLocaleString('id-ID')}.`;
}
function hitungLabaModal() {
  const ma = parseFloat(document.getElementById("lk-ma").value) || 0;
  const pd = parseFloat(document.getElementById("lk-pd").value) || 0;
  const bb = parseFloat(document.getElementById("lk-bb").value) || 0;
  const pr = parseFloat(document.getElementById("lk-pr").value) || 0;
  const laba = pd - bb;
  const akhir = ma + laba - pr;
  const el = document.getElementById("res-lk");
  el.style.display = "block";
  el.innerHTML = `📊 <strong>${laba >= 0 ? 'Laba Bersih' : 'Rugi Bersih'} = Rp ${Math.abs(laba).toLocaleString('id-ID')}</strong> | Modal Akhir = <strong>Rp ${akhir.toLocaleString('id-ID')}</strong>`;
}

function getYouTubeId(url) {
  const m = String(url || "").match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function pickOpt(babId, qIdx, oIdx) {
  tempAns[qIdx] = oIdx;
  appData.quizzes[babId].questions[qIdx].opts.forEach((_, i) => {
    document.getElementById(`qo-${qIdx}-${i}`).classList.remove("selected");
  });
  document.getElementById(`qo-${qIdx}-${oIdx}`).classList.add("selected");
}

function gradeQuiz(babId) {
  const qs = appData.quizzes[babId].questions;
  let right = 0;
  qs.forEach((item, idx) => {
    const u = tempAns[idx];
    item.opts.forEach((_, oIdx) => {
      const btn = document.getElementById(`qo-${idx}-${oIdx}`);
      btn.classList.remove("selected");
      btn.disabled = true;
      if (oIdx === item.ans) btn.classList.add("correct");
      else if (oIdx === u && u !== item.ans) btn.classList.add("wrong");
    });
    if (u === item.ans) right++;
    const ex = document.getElementById(`qex-${idx}`);
    ex.style.display = "block";
    ex.innerHTML = `${u === item.ans ? '✅ <strong>Benar!</strong>' : '❌ <strong>Salah.</strong>'} ${esc(item.exp)}`;
  });
  const score = Math.round((right / qs.length) * 100);
  state.scores[babId] = score;
  localStorage.setItem("labalab_scores", JSON.stringify(state.scores));
  document.getElementById("scoreBox").innerHTML = `🎉 Skor Anda: <span style="color:var(--primary); font-size:20px;">${score}/100</span> (${right}/${qs.length} benar)`;
}

      <button class="btn-primary" onclick="state.editingBabId='__NEW__'; render();">+ Tambah Bab Materi Baru</button>
    </div>
    <div class="grid-2">
      ${appData.chapters.map((c, idx) => `
        <div class="card" style="border-left:5px solid ${c.color};">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="step-tag" style="background:${c.color};">${esc(c.num)}</span>
            <div style="display:flex; gap:6px;">
              <button class="btn-outline" style="padding:5px 10px; font-size:12px;" onclick="state.editingBabId='${c.id}'; render();">✏️ Edit</button>
              <button class="btn-danger" onclick="deleteChapter(${idx})">Hapus</button>
            </div>
          </div>
          <h4>${esc(c.title)}</h4>
          <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">${esc(c.desc)}</p>
        </div>
      `).join("")}
    </div>
  `;
}

function saveChapterEdit(targetId) {
  const title = document.getElementById("eb-title").value.trim();
  if (!title) return alert("Judul bab tidak boleh kosong.");
  const rawHtml = document.getElementById("eb-html").value;
  const formattedHtml = rawHtml.includes("<") ? rawHtml : `<div class="card"><p style="white-space:pre-line; font-size:14px;">${esc(rawHtml)}</p></div>`;

  const obj = {
    step: document.getElementById("eb-step").value.trim() || "01",
    num: document.getElementById("eb-num").value.trim() || "Bab Baru",
    color: document.getElementById("eb-color").value || "#0f766e",
    title,
    desc: document.getElementById("eb-desc").value.trim(),
    continuity: document.getElementById("eb-cont").value.trim(),
    tujuan: document.getElementById("eb-tuj").value.split("\n").map(x => x.trim()).filter(Boolean),
    contentHtml: formattedHtml
  };

  if (targetId === "__NEW__") {
    const newId = "bab" + Date.now();
    appData.chapters.push({ id: newId, simType: "none", ...obj });
    appData.quizzes[newId] = { title: `Evaluasi ${obj.num}: ${obj.title}`, questions: [] };
    appData.config.quizizzLinks[newId] = "https://quizizz.com/";
  } else {
    const idx = appData.chapters.findIndex(c => c.id === targetId);
    appData.chapters[idx] = { ...appData.chapters[idx], ...obj };
  }
  state.editingBabId = null;
  saveAppData("Materi bab berhasil disimpan!");
  render();
}

function deleteChapter(idx) {
  if (appData.chapters.length <= 1) return alert("Minimal harus tersisa 1 bab materi.");
  if (!confirm(`Hapus ${appData.chapters[idx].num}: ${appData.chapters[idx].title}?`)) return;
  appData.chapters.splice(idx, 1);
  saveAppData("Bab materi dihapus.");
  render();
}

function renderAdminVideo() {
  return `
    <div class="card" style="margin-bottom:18px;">
      <h4 style="margin-bottom:10px;">➕ Tambah Link Video YouTube Baru</h4>
      <div class="calc-grid">
        <div class="input-group"><label>Label Bab</label><input type="text" id="nv-bab" placeholder="Contoh: Bab I / Tambahan"></div>
        <div class="input-group"><label>Judul Video</label><input type="text" id="nv-title" placeholder="Judul penjelasan video..."></div>
        <div class="input-group"><label>Link URL YouTube</label><input type="url" id="nv-url" placeholder="https://www.youtube.com/watch?v=..."></div>
      </div>
      <button class="btn-primary" onclick="addVideo()">+ Tambahkan Video</button>
    </div>

    <div class="grid-2">
      ${appData.videos.map((v, i) => `
        <div class="card">
          <div class="input-group"><label>Bab</label><input type="text" id="ev-bab-${i}" value="${esc(v.bab)}"></div>
          <div class="input-group"><label>Judul Video</label><input type="text" id="ev-title-${i}" value="${esc(v.title)}"></div>
          <div class="input-group"><label>Link YouTube</label><input type="url" id="ev-url-${i}" value="${esc(v.url)}"></div>

function addVideo() {
  const bab = document.getElementById("nv-bab").value.trim() || "Materi";
  const title = document.getElementById("nv-title").value.trim();
  const url = document.getElementById("nv-url").value.trim();
  if (!title || !url) return alert("Judul dan Link YouTube wajib diisi.");
  appData.videos.push({ bab, title, url });
  saveAppData("Video YouTube ditambahkan!");
  render();
}

function updateVideo(i) {
  appData.videos[i] = {
    bab: document.getElementById(`ev-bab-${i}`).value.trim(),
    title: document.getElementById(`ev-title-${i}`).value.trim(),
    url: document.getElementById(`ev-url-${i}`).value.trim()
  };
  saveAppData("Video berhasil diperbarui!");
}

function deleteVideo(i) {
  appData.videos.splice(i, 1);
  saveAppData("Video dihapus.");
  render();
}

function renderAdminKuis() {
  return `
    <div class="card" style="margin-bottom:18px;">
      <h4 style="margin-bottom:10px;">🎮 Edit Link Quizizz Per Bab</h4>
      <div class="grid-2">
        ${appData.chapters.map(c => `
          <div class="input-group">
            <label>Link Quizizz — ${esc(c.num)} (${esc(c.title)})</label>
            <input type="url" id="ql-${c.id}" value="${esc(appData.config.quizizzLinks[c.id] || '')}" placeholder="https://quizizz.com/...">
          </div>
        `).join("")}
      </div>
      <button class="btn-primary" onclick="saveQuizizzLinks()">💾 Simpan Semua Link Quizizz</button>
    </div>

    <div class="card">
      <h4 style="margin-bottom:10px;">➕ Tambah Soal Pilihan Ganda ke Kuis Aplikasi</h4>
      <div class="calc-grid">
        <div class="input-group">
          <label>Pilih Bab</label>
          <select id="nq-bab">
            ${appData.chapters.map(c => `<option value="${c.id}">${esc(c.num)} — ${esc(c.title)}</option>`).join("")}
          </select>
        </div>
        <div class="input-group">
          <label>Kunci Jawaban Benar</label>
          <select id="nq-ans">
            <option value="0">Pilihan A</option><option value="1">Pilihan B</option>
            <option value="2">Pilihan C</option><option value="3">Pilihan D</option>
          </select>
        </div>
      </div>
      <div class="input-group"><label>Pertanyaan</label><input type="text" id="nq-q" placeholder="Tulis pertanyaan..."></div>
      <div class="grid-2">
        <div class="input-group"><label>Pilihan A</label><input type="text" id="nq-a"></div>
        <div class="input-group"><label>Pilihan B</label><input type="text" id="nq-b"></div>
        <div class="input-group"><label>Pilihan C</label><input type="text" id="nq-c"></div>
        <div class="input-group"><label>Pilihan D</label><input type="text" id="nq-d"></div>
      </div>
      <div class="input-group"><label>Pembahasan Singkat</label><input type="text" id="nq-exp" placeholder="Penjelasan mengapa jawaban tersebut benar..."></div>
      <button class="btn-primary" onclick="addQuizQuestion()">+ Tambahkan Soal</button>
    </div>

    <div class="card" style="margin-top:18px;">
      <h4 style="margin-bottom:10px;">📋 Daftar Soal Saat Ini</h4>
      ${appData.chapters.map(c => {
        const qs = appData.quizzes[c.id]?.questions || [];
        return `
          <div style="margin-bottom:14px;">
            <strong style="color:var(--primary);">${esc(c.num)} (${qs.length} soal)</strong>
            ${qs.map((item, qi) => `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#f8fafc; border-radius:8px; margin-top:4px; gap:10px;">
                <span style="font-size:12.5px;">${qi+1}. ${esc(item.q)}</span>
                <button class="btn-danger" onclick="deleteQuizQuestion('${c.id}', ${qi})">Hapus</button>
              </div>
            `).join("")}
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function saveQuizizzLinks() {
  appData.chapters.forEach(c => {
    appData.config.quizizzLinks[c.id] = document.getElementById(`ql-${c.id}`).value.trim() || "#";
  });
  saveAppData("Semua link Quizizz berhasil disimpan!");
}

function addQuizQuestion() {
  const bab = document.getElementById("nq-bab").value;
  const q = document.getElementById("nq-q").value.trim();
  const opts = [
    document.getElementById("nq-a").value.trim(),
    document.getElementById("nq-b").value.trim(),
    document.getElementById("nq-c").value.trim(),
    document.getElementById("nq-d").value.trim()
  ];
  const ans = parseInt(document.getElementById("nq-ans").value, 10);
  const exp = document.getElementById("nq-exp").value.trim() || "Jawaban sesuai konsep materi.";
  if (!q || opts.some(o => !o)) return alert("Pertanyaan dan seluruh pilihan A-D wajib diisi.");

  if (!appData.quizzes[bab]) appData.quizzes[bab] = { title: `Evaluasi ${bab}`, questions: [] };
  appData.quizzes[bab].questions.push({ q, opts, ans, exp });
  saveAppData("Soal baru berhasil ditambahkan!");
  render();
}

function deleteQuizQuestion(bab, idx) {
  appData.quizzes[bab].questions.splice(idx, 1);
  saveAppData("Soal dihapus.");
  render();
}

function renderAdminReferensi() {
  return `
    <div class="grid-2">
      <div class="card">
        <h4 style="margin-bottom:10px;">📖 Tambah Istilah Glosarium</h4>
        <div class="input-group"><label>Istilah</label><input type="text" id="ng-term" placeholder="Contoh: Jurnal Penutup"></div>
        <div class="input-group"><label>Pengertian</label><textarea id="ng-def" style="min-height:65px;"></textarea></div>
        <button class="btn-primary" onclick="addGlossaryTerm()">+ Tambah ke Glosarium</button>
      </div>

      <div class="card">
        <h4 style="margin-bottom:10px;">📚 Tambah Daftar Pustaka</h4>
        <div class="input-group"><label>Referensi Buku / Jurnal (Format APA)</label><textarea id="nb-ref" placeholder="Contoh: Kasmir. (2020). Pengantar Akuntansi..."></textarea></div>
        <button class="btn-primary" onclick="addBibRef()">+ Tambah ke Daftar Pustaka</button>
      </div>
    </div>
  `;
}

function addGlossaryTerm() {
  const t = document.getElementById("ng-term").value.trim();
  const d = document.getElementById("ng-def").value.trim();
  if (!t || !d) return alert("Istilah dan pengertian wajib diisi.");
  appData.glossary.unshift([t, d]);
  saveAppData("Istilah baru ditambahkan ke Glosarium!");
  render();
}

function addBibRef() {
  const r = document.getElementById("nb-ref").value.trim();
  if (!r) return alert("Referensi tidak boleh kosong.");
  appData.bibliography.push(r);
  saveAppData("Referensi ditambahkan ke Daftar Pustaka!");
  render();
}

function renderAdminAkunBackup() {
  return `
    <div class="grid-2">
      <div class="card">
        <h4 style="margin-bottom:10px;">🔑 Ubah Username & Password Penyusun</h4>
        <div class="input-group"><label>Username Baru</label><input type="text" id="sec-user" value="${esc(appData.auth.username)}"></div>
        <div class="input-group"><label>Password Baru</label><input type="text" id="sec-pass" value="${esc(appData.auth.password)}"></div>
        <button class="btn-primary" onclick="updateAdminAuth()">💾 Perbarui Akun Login</button>
      </div>

      <div class="card">
        <h4 style="margin-bottom:10px;">💾 Backup / Restore & Reset Data</h4>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">
          Unduh file backup pengaturan/materi Anda (.json) agar dapat dipindahkan ke perangkat lain atau di-restore kapan saja.
        </p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
          <button class="btn-primary" onclick="exportBackup()">⬇ Unduh Backup (.json)</button>
          <button class="btn-danger" onclick="resetAllData()">↺ Reset ke Pengaturan Awal</button>
        </div>
        <div class="input-group">
          <label>Restore dari File Backup (.json)</label>
          <input type="file" accept=".json" onchange="importBackup(event)" />
        </div>
      </div>
    </div>
  `;
}

function updateAdminAuth() {
  const u = document.getElementById("sec-user").value.trim();
  const p = document.getElementById("sec-pass").value.trim();
  if (!u || !p) return alert("Username dan password tidak boleh kosong.");
  appData.auth = { username: u, password: p };
  saveAppData("Username & password penyusun diperbarui!");
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "backup-materi-labalab.json";
  a.click();
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed.chapters || !parsed.config) throw new Error();
      appData = parsed;
      saveAppData("Data berhasil di-restore dari backup!");
      render();
    } catch {
      alert("Format file backup JSON tidak valid.");
    }
  };
  reader.readAsText(file);
}

function resetAllData() {
  if (!confirm("Kembalikan seluruh materi, link, dan profil ke pengaturan awal?")) return;
  appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveAppData("Seluruh data berhasil direset ke awal.");
  render();
}

renderSidebar();
renderTopUser();
render();
</script>
